name: Windows template checks
on:
  push:
  pull_request:
jobs:
  bootstrap:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build and run executable smoke assertions
        shell: pwsh
        run: ./scripts/test.ps1 -Configuration Release
      - name: Validate all local startup configurations
        shell: pwsh
        run: |
          foreach ($id in 1..3) {
            & ./scripts/start-server.ps1 -NodeId $id -Check
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & ./scripts/start-client.ps1 -ClientId $id -Check
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
